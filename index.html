<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kid Racer Fun</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>🏁 Kid Racer Fun</h1>
        <p>Drive, dodge, and collect stars!</p>
      </header>

      <section class="brand-panel" aria-label="Car brand logos">
        <h2>Pick Your Car Brand</h2>
        <div class="brand-grid" id="brandGrid">
          <button class="brand-card selected" data-color="#ff4d4d" data-brand="Rocket Horse">
            <span class="logo-circle">🐎</span>
            <span class="brand-name">Rocket Horse</span>
          </button>
          <button class="brand-card" data-color="#4da6ff" data-brand="Lightning Bull">
            <span class="logo-circle">🐂</span>
            <span class="brand-name">Lightning Bull</span>
          </button>
          <button class="brand-card" data-color="#ffd24d" data-brand="Turbo Tiger">
            <span class="logo-circle">🐯</span>
            <span class="brand-name">Turbo Tiger</span>
          </button>
          <button class="brand-card" data-color="#66e066" data-brand="Speed Dragon">
            <span class="logo-circle">🐉</span>
            <span class="brand-name">Speed Dragon</span>
          </button>
        </div>
      </section>

      <section class="hud" aria-live="polite">
        <p><strong>Brand:</strong> <span id="selectedBrand">Rocket Horse</span></p>
        <p><strong>Score:</strong> <span id="score">0</span></p>
        <p><strong>Best:</strong> <span id="bestScore">0</span></p>
      </section>

      <canvas id="gameCanvas" width="420" height="620" aria-label="Car racing game"></canvas>

      <section class="controls">
        <button id="leftBtn" class="control-btn">⬅️ Left</button>
        <button id="startBtn" class="control-btn start">▶️ Start / Restart</button>
        <button id="rightBtn" class="control-btn">Right ➡️</button>
      </section>

      <p class="tips">Tip: Use arrow keys, tap buttons, and avoid crash cars. Collect ⭐ stars!</p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
